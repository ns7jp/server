# checkov の挙動を project レベルで設定する。
# skip-check に載せる check は HIGH severity 相当でないこと、または
# トレードオフの理由が判断付きで書ける場合のみとする。

framework:
  - terraform
quiet: true

skip-check:
  # S3 access logging: アクセスログ専用バケット自身に再帰的にログを書くのは過剰。
  - CKV_AWS_18

  # Cross-region replication: 学習目的のため単一リージョン運用。複製コストを避ける。
  - CKV_AWS_144

  # S3 default KMS: ALB アクセスログ用バケットは AES256 必須（仕様）。
  # CloudTrail / Archive バケットは aws_s3_bucket_server_side_encryption_configuration
  # で KMS を設定済みだが、checkov が別リソースを検出しないため false positive。
  - CKV_AWS_145

  # LB deletion protection: ラボ用途で `terraform destroy` を頻繁に行うため OFF。
  # prod でデプロイを長期化する場合は再考。
  - CKV_AWS_150

  # CloudWatch logs retention 1 year: VPC Flow Logs / CloudTrail logs は cost を抑えるため
  # 既定 30 日。長期保管は CloudTrail の S3 アーカイブが担当する（バケット側で 365 日保持）。
  - CKV_AWS_338

  # EventBridge Scheduler CMK: 内部スケジュール（EC2 stop/start）のみで機密入力なし。
  - CKV_AWS_297

  # S3 versioning: aws_s3_bucket_versioning を全バケット設定済みだが、count 付き
  # リソース（CloudTrail）で checkov の追跡が外れる false positive。
  - CKV_AWS_21

  # LB no HTTP: dev は HTTP 平文転送を受け入れる（ACM 証明書未設定時）。
  # prod は certificate_arn 必須のため必ず 443→80 redirect になる。
  - CKV_AWS_378

  # LB TLS 1.2: ssl_policy = `ELBSecurityPolicy-TLS13-1-2-2021-06` を使用しており、
  # TLS 1.3 / 1.2 のみを許可している。checkov の検出ロジックが新しい policy 名に
  # 追随していない false positive。
  - CKV_AWS_103

  # CKV2_*（複数リソース関連の検査）の false positive / トレードオフ
  # ----------------------------------------------------------------

  # S3 event notifications: ラボのバックアップ / 監査用バケットに lambda hook を
  # 紐づける運用要件はないため抑止する。
  - CKV2_AWS_62

  # KMS key policy: 各 KMS には用途別ポリシーを設定済み。checkov が `policy`
  # 属性を attribute レベルでチェックする際、`jsonencode({...})` の中身を解析
  # できず false positive になることがある。
  - CKV2_AWS_64

  # S3 lifecycle: CloudTrail バケットには aws_s3_bucket_lifecycle_configuration
  # を別リソースで設定しているが、`count = var.enable_cloudtrail ? 1 : 0` の
  # 連動を checkov が追えないため false positive。
  - CKV2_AWS_61

  # S3 public access block: 同じく count 連動の false positive。
  - CKV2_AWS_6

  # GuardDuty org/region: 単一アカウント単一リージョンの構成では満たせない。
  # 学習用環境のため受け入れる。
  - CKV2_AWS_3

  # CloudTrail → CloudWatch Logs: cloud_watch_logs_group_arn を設定済み。
  # `count` ラップにより検出されない false positive。
  - CKV2_AWS_10

  # ALB の HTTP→HTTPS redirect: certificate_arn 設定時に redirect、未設定（dev）
  # 時に forward する dynamic block を使用しているため、checkov の静的解析では
  # 検出できない false positive。
  - CKV2_AWS_20

  # ALB の WAF: 学習用環境のためコスト優先で WAF を導入しない。
  # 本番では `wafv2_web_acl_association` で追加する。
  - CKV2_AWS_28
