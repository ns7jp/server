---
- name: Verify foundation outcomes (common + docker interaction)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # docker role 単体の scenario は prepare.yml でアカウントを手作りしていた。
    # ここでは common role が実際に作ったアカウントを docker role がそのまま
    # 扱えることを確認する。
    - name: Read the application account's supplementary groups
      ansible.builtin.command: id -Gn "{{ server_monitor_user }}"
      register: app_account_groups
      changed_when: false

    - name: Assert the account common role created is not in the docker group
      ansible.builtin.assert:
        that:
          - "'docker' not in app_account_groups.stdout.split()"
        fail_msg: >-
          The account common role creates for {{ server_monitor_user }} must
          not gain docker group membership just because the docker role ran
          in the same play.

    - name: Check the install directory common role created
      ansible.builtin.stat:
        path: "{{ server_monitor_install_dir }}"
      register: install_dir

    - name: Assert the install directory survived the docker role run
      ansible.builtin.assert:
        that:
          - install_dir.stat.exists
          - install_dir.stat.isdir
          - install_dir.stat.pw_name == server_monitor_user

    - name: Check that the Docker CLI and Compose plugin are installed
      ansible.builtin.command: "{{ item }}"
      loop:
        - docker --version
        - docker compose version
      changed_when: false

    # ファイル本文の grep では Include の順序を読み違えたまま通ってしまう。
    # sshd が実際に採用する値を検査する。
    - name: Read the effective sshd configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
      register: sshd_effective
      changed_when: false

    - name: Assert common role's sshd hardening survived the docker role run
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in (sshd_effective.stdout | lower)"
          - "'passwordauthentication no' in (sshd_effective.stdout | lower)"
