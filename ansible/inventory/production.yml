---
# 本番ホストの IP / SSH ユーザーは運用者が記入する。
# `ansible-vault` で暗号化された secrets は inventory/group_vars/monitor/vault.yml を参照。
all:
  children:
    monitor:
      hosts:
        monitor-prod-01:
          ansible_host: 198.51.100.10
          ansible_user: deploy
          ansible_python_interpreter: /usr/bin/python3
  vars:
    server_monitor_environment: production
    # 本番では HTTPS と Let's Encrypt を有効化する想定。
    nginx_letsencrypt_enabled: true
    nginx_letsencrypt_email: noc@example.com
    nginx_server_name: monitor.example.com
