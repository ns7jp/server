---
# OS とユーザー
server_monitor_timezone: Asia/Tokyo
server_monitor_user: monitor
server_monitor_group: monitor
server_monitor_install_dir: /opt/server-monitor
server_monitor_secrets_dir: "{{ server_monitor_install_dir }}/deploy/secrets"

# 環境（staging / production）はインベントリで上書きする
server_monitor_environment: staging

# UFW で許可する着信ポート
server_monitor_allowed_tcp_ports:
  - 22

# Docker
docker_apt_release_channel: stable
docker_log_max_size: "10m"
docker_log_max_file: 5

# repo の取得方法。どちらもcontroller上でtracked release archiveを作り、targetへ同期する。
# - directory: controllerのcleanな既存checkoutのHEADをarchiveする
# - git: controllerの一時checkoutへimmutable SHAを取得してarchiveする
server_monitor_source_mode: directory
# playbook_dir は <repo>/ansible/playbooks。リポジトリ正本（compose.yaml、deploy/、app.py 等）を
# 配備するため 2 階層上を参照する。1 階層上では ansible/ だけが同期対象になってしまう。
server_monitor_source_path: "{{ playbook_dir }}/../.."
server_monitor_git_repo: https://github.com/ns7jp/server-monitor.git
# git modeは再現可能な配備にするため、inventoryで40桁commit SHAを必ず指定する。
# branch名やmainは時点によって内容が変わるため受け付けない。
server_monitor_git_version: ""
