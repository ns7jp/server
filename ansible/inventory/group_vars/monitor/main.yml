---
# ダッシュボードを動作させるための非機密値。
# 機密値は ansible-vault で暗号化した inventory/group_vars/monitor/vault.yml に置く。

monitor_node_name: "{{ inventory_hostname }}"
monitor_port: 8080
prometheus_port: 9090
alertmanager_port: 9093
grafana_port: 3000
loki_port: 3100
monitor_username: monitor

# Vault からの参照（vault.yml.example をコピーして暗号化する）
monitor_password: "{{ vault_monitor_password }}"
metrics_token: "{{ vault_metrics_token }}"
grafana_admin_password: "{{ vault_grafana_admin_password }}"
app_slack_webhook_url: "{{ vault_slack_webhook_url | default('') }}"

# Slack 通知を有効化する場合は true、未設定なら local-alert-view のまま
app_alertmanager_slack_enabled: false

# バックアップ
backup_enabled: true
backup_target_dir: /var/backups/server-monitor
backup_retention_days: 14
backup_schedule_oncalendar: "*-*-* 03:30:00"
