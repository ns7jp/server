[defaults]
inventory = inventory/staging.yml
roles_path = roles
collections_paths = collections:~/.ansible/collections
stdout_callback = ansible.builtin.default
callback_result_format = yaml
forks = 10
deprecation_warnings = False
interpreter_python = auto_silent
# Vault パスワードは ANSIBLE_VAULT_PASSWORD_FILE か --vault-password-file で渡す。
# ファイルを既定にすると CI のように存在しない環境で起動できないため指定しない。
#
# host_key_checking はここで無効化しない。CI（inventory/ci.yml）は
# ansible_connection: local のため SSH 自体を行わず無関係。staging /
# production への初回適用では ssh-keyscan で known_hosts を正しく登録する。

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
