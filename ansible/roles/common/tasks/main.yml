---
- name: Validate install directory syntax before any host mutation
  ansible.builtin.assert:
    that:
      - (server_monitor_user | string) != 'root'
      - (server_monitor_group | string) != 'root'
      - (server_monitor_group | string) != 'docker'
      - >-
        (server_monitor_install_dir | string)
        is match('^/(opt|srv)/[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$')
      - "'/./' not in ((server_monitor_install_dir | string) ~ '/')"
      - "'/../' not in ((server_monitor_install_dir | string) ~ '/')"
    fail_msg: >-
      The application account and primary group must not be root, and the
      primary group must not be docker. server_monitor_install_dir must be a dedicated absolute directory
      below /opt or /srv and must not contain dot segments.

# OS ファミリーごとの差分は vars/<family>.yml にだけ置き、tasks は変数を読む。
# 未対応 OS で途中まで適用してしまう事故を避けるため、最初に落とす。
- name: Refuse an unsupported OS family before any host mutation
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Unsupported OS family {{ ansible_os_family | default('unknown') }}.
      This role supports Debian family (Ubuntu 22.04 / 24.04) and
      RedHat family (AlmaLinux / Rocky 9). No mutation has been made.

- name: Load OS family specific variables
  ansible.builtin.include_vars:
    file: "{{ ansible_os_family }}.yml"

- name: Resolve install directory through parent path components
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv:
      - realpath
      - -m
      - --
      - "{{ server_monitor_install_dir }}"
  check_mode: false
  changed_when: false
  register: common_install_realpath

- name: Inspect install directory without following final symlink
  ansible.builtin.stat:
    path: "{{ server_monitor_install_dir }}"
    follow: false
  register: common_install_path

- name: Refuse non-canonical or non-directory install target
  ansible.builtin.assert:
    that:
      - common_install_realpath.stdout == (server_monitor_install_dir | string)
      - >-
        not common_install_path.stat.exists
        or (common_install_path.stat.isdir and not common_install_path.stat.islnk)
    fail_msg: >-
      Refusing deployment because {{ server_monitor_install_dir }} resolves to
      {{ common_install_realpath.stdout | default('unknown') }} or is not a real
      directory. No package, account, or filesystem mutation has been made.

- name: Install base packages
  ansible.builtin.include_tasks: packages.yml

- name: Configure time synchronization
  ansible.builtin.include_tasks: time.yml

- name: Configure host firewall
  ansible.builtin.include_tasks: "firewall-{{ common_firewall_backend }}.yml"
  when: common_manage_firewall | bool

# 鍵で入れる管理者アカウントの用意は、必ず SSH の締め付けより前に行う。
- name: Ensure key-based administrative access exists
  ansible.builtin.include_tasks: admin-access.yml

- name: Harden SSH server configuration
  ansible.builtin.include_tasks: ssh.yml

- name: Configure unattended security updates
  ansible.builtin.include_tasks: auto-updates.yml

- name: Configure SELinux
  ansible.builtin.include_tasks: selinux.yml
  when:
    - common_selinux_supported | bool
    - common_manage_selinux | bool

- name: Create the application account and install directory
  ansible.builtin.include_tasks: account.yml
