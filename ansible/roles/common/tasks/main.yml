---
- name: Validate install directory syntax before any host mutation
  ansible.builtin.assert:
    that:
      - (server_monitor_user | string) != 'root'
      - (server_monitor_group | string) != 'root'
      - (server_monitor_group | string) != 'docker'
      - >-
        (server_monitor_install_dir | string)
        is match('^/(opt|srv)/[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$')
      - "'/./' not in ((server_monitor_install_dir | string) ~ '/')"
      - "'/../' not in ((server_monitor_install_dir | string) ~ '/')"
    fail_msg: >-
      The application account and primary group must not be root, and the
      primary group must not be docker. server_monitor_install_dir must be a dedicated absolute directory
      below /opt or /srv and must not contain dot segments.

- name: Resolve install directory through parent path components
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv:
      - realpath
      - -m
      - --
      - "{{ server_monitor_install_dir }}"
  check_mode: false
  changed_when: false
  register: common_install_realpath

- name: Inspect install directory without following final symlink
  ansible.builtin.stat:
    path: "{{ server_monitor_install_dir }}"
    follow: false
  register: common_install_path

- name: Refuse non-canonical or non-directory install target
  ansible.builtin.assert:
    that:
      - common_install_realpath.stdout == (server_monitor_install_dir | string)
      - >-
        not common_install_path.stat.exists
        or (common_install_path.stat.isdir and not common_install_path.stat.islnk)
    fail_msg: >-
      Refusing deployment because {{ server_monitor_install_dir }} resolves to
      {{ common_install_realpath.stdout | default('unknown') }} or is not a real
      directory. No package, account, or filesystem mutation has been made.

- name: Ensure required packages are installed
  ansible.builtin.apt:
    name: "{{ common_required_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Ensure chrony is enabled and running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  when: common_manage_services | bool

- name: Configure UFW default incoming policy
  community.general.ufw:
    state: enabled
    policy: "{{ common_ufw_default_incoming }}"
    direction: incoming

- name: Allow configured TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ common_ufw_allowed_tcp_ports | map('int') | list | difference(common_ufw_rate_limited_ports) }}"

- name: Rate-limit SSH instead of plain allow
  community.general.ufw:
    rule: limit
    port: "{{ common_ufw_ssh_port }}"
    proto: tcp
  when:
    - common_ufw_limit_ssh | bool
    - (common_ufw_ssh_port | int) in (common_ufw_allowed_tcp_ports | map('int') | list)

- name: Ensure sshd runtime directory exists for configuration validation
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    create: false
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload sshd
  when: common_disable_root_ssh | bool

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    create: false
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload sshd
  when: not (common_password_authentication | bool)

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: '0644'

- name: Ensure application group exists
  ansible.builtin.group:
    name: "{{ server_monitor_group }}"
    state: present
    system: true

- name: Ensure application user exists
  ansible.builtin.user:
    name: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ server_monitor_install_dir }}"
    create_home: false

- name: Ensure application install directory exists
  ansible.builtin.file:
    path: "{{ server_monitor_install_dir }}"
    state: directory
    owner: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    mode: '0750'
    follow: false
