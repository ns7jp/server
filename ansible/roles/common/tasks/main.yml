---
- name: Ensure required packages are installed
  ansible.builtin.apt:
    name: "{{ common_required_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Ensure chrony is enabled and running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  when: common_manage_services | bool

- name: Configure UFW default incoming policy
  community.general.ufw:
    state: enabled
    policy: "{{ common_ufw_default_incoming }}"
    direction: incoming

- name: Allow configured TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ common_ufw_allowed_tcp_ports }}"

- name: Rate-limit SSH on port 22
  community.general.ufw:
    rule: limit
    port: 22
    proto: tcp
  when: 22 in common_ufw_allowed_tcp_ports

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    create: false
    state: present
  notify: Restart sshd
  when: common_disable_root_ssh | bool

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    create: false
    state: present
  notify: Restart sshd
  when: not (common_password_authentication | bool)

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: '0644'

- name: Ensure application group exists
  ansible.builtin.group:
    name: "{{ server_monitor_group }}"
    state: present
    system: true

- name: Ensure application user exists
  ansible.builtin.user:
    name: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ server_monitor_install_dir }}"
    create_home: false

- name: Ensure application install directory exists
  ansible.builtin.file:
    path: "{{ server_monitor_install_dir }}"
    state: directory
    owner: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    mode: '0750'
