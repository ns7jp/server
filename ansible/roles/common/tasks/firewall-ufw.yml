---
- name: Configure UFW default incoming policy
  community.general.ufw:
    state: enabled
    policy: "{{ common_ufw_default_incoming }}"
    direction: incoming

- name: Allow configured TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ common_ufw_allowed_tcp_ports | map('int') | list | difference(common_ufw_rate_limited_ports) }}"

- name: Record the ALB/VPC source policy in UFW for the application entry port
  community.general.ufw:
    rule: allow
    port: "{{ common_ufw_alb_target_port }}"
    proto: tcp
    from_ip: "{{ common_ufw_alb_source_cidr }}"
  when: common_ufw_alb_source_cidr | length > 0

# 管理元 CIDR が未指定なら、全送信元に対する rate limit だけを掛ける。
# これは総当たりの抑止であって、送信元制限ではない。
- name: Rate-limit SSH from any source
  community.general.ufw:
    rule: limit
    port: "{{ common_ufw_ssh_port }}"
    proto: tcp
  when:
    - common_ufw_limit_ssh | bool
    - common_ufw_ssh_source_cidr | length == 0
    - (common_ufw_ssh_port | int) in (common_ufw_allowed_tcp_ports | map('int') | list)

# 管理元 CIDR が指定されたら、その範囲だけに絞る。
# 先に絞った rule を入れてから、下で無制限 rule を外す順序にしている。
# 逆順にすると、代わりの経路を作る前に SSH を閉じることになる。
- name: Rate-limit SSH from the management source only
  community.general.ufw:
    rule: limit
    port: "{{ common_ufw_ssh_port }}"
    proto: tcp
    from_ip: "{{ common_ufw_ssh_source_cidr }}"
  when:
    - common_ufw_limit_ssh | bool
    - common_ufw_ssh_source_cidr | length > 0
    - (common_ufw_ssh_port | int) in (common_ufw_allowed_tcp_ports | map('int') | list)

# 無制限 rule を残したままだと、上で絞った意味が無くなる。
- name: Remove the unrestricted SSH rule once a management source is set
  community.general.ufw:
    delete: true
    rule: limit
    port: "{{ common_ufw_ssh_port }}"
    proto: tcp
  when:
    - common_ufw_limit_ssh | bool
    - common_ufw_ssh_source_cidr | length > 0
