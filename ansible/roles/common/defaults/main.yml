---
common_timezone: "{{ server_monitor_timezone | default('Asia/Tokyo') }}"
# サービスの起動・再起動を行うかどうか。既定 true。
# 構築とサービス起動を分けたい場面（イメージ作成時など）のための切り替えで、
# Molecule では true のまま chrony 起動と sshd 再起動を実際に検証する。
common_manage_services: true

# 導入パッケージ。OS ファミリー別の一覧は vars/<family>.yml が持つ。
# 案件固有の追加は common_extra_packages を使い、本体一覧は上書きしない。
common_required_packages: "{{ common_os_packages }}"
common_extra_packages: []
# AlmaLinux / Rocky で EPEL を有効化するか。base だけで足りる案件では false。
common_enable_epel: true

common_disable_root_ssh: true
common_password_authentication: false

# sshd は最初に得た値を採用し、Ubuntu 22.04 / 24.04 も AlmaLinux / Rocky 9 も
# sshd_config の先頭で drop-in を読む。cloud image の 50-cloud-init.conf に
# 負けないよう 10- で始める。
common_sshd_dropin_path: /etc/ssh/sshd_config.d/10-hardening.conf
# ファイルの中身ではなく sshd -T の実効値を検査するかどうか。
# 既定 true。false にする場合は、その理由を証跡へ残すこと。
common_verify_sshd_effective: true

# 鍵で入れる管理者アカウント。恒久ホストでは必ず設定する。
# 空のままでも既存の authorized_keys があれば適用できるが、
# どちらも無い状態で password 認証を落とすことは拒否する。
common_admin_user: "{{ server_monitor_admin_user | default('') }}"
common_admin_authorized_keys: "{{ server_monitor_admin_authorized_keys | default([]) }}"
# true にすると、role が管理する鍵以外を authorized_keys から取り除く。
common_admin_authorized_keys_exclusive: false
common_admin_sudo_nopasswd: false
common_admin_sudo_group: "{{ common_default_sudo_group }}"
# SSH 以外の手段で接続している場合（docker 接続の Molecule コンテナ、
# クラウドのシリアルコンソールなど）にだけ true にする。
common_allow_keyless_password_lockout: false

# firewall を実際に操作するか。既定 true。
# firewalld / ufw は host 側の nftables / iptables kernel module を使うため、
# 一部のコンテナ環境では操作できない。docker role の docker_manage_service や
# monitoring role の monitoring_run_validation と同じ切り替え方針。
common_manage_firewall: true

# firewall backend: ufw（Debian 系既定）または firewalld（RHEL 系既定）。
# 案件で明示したい場合は inventory から上書きする。
common_firewall_backend: "{{ common_default_firewall_backend }}"

common_ufw_default_incoming: deny
common_ufw_allowed_tcp_ports: "{{ server_monitor_allowed_tcp_ports | default([22]) }}"
common_ufw_alb_source_cidr: "{{ server_monitor_alb_source_cidr | default('') }}"
common_ufw_alb_target_port: "{{ server_monitor_alb_target_port | default(8080) }}"
# SSH は allow ではなく limit で開放し、総当たりを抑止する。
# 同じ port へ allow と limit の両方を適用すると ufw 上で互いを上書きし、
# 実行のたびに changed となって冪等性が壊れる。そのため limit 対象の port は
# allow のループから除外する。
common_ufw_limit_ssh: true
common_ufw_ssh_port: 22
# 管理元 CIDR。設定すると SSH をその範囲だけに絞る。
# 空のままだと全送信元に対する rate limit のみで、送信元制限にはならない。
# 04-network-ip-plan.md が「受入条件なら案件変数として実装する」としていた項目。
common_ufw_ssh_source_cidr: "{{ server_monitor_ssh_source_cidr | default('') }}"
common_ufw_rate_limited_ports: "{{ [common_ufw_ssh_port | int] if (common_ufw_limit_ssh | bool) else [] }}"

# firewalld 側は zone を明示する。既定 zone を暗黙に使うと、案件ごとに
# 既定値が異なる環境で許可範囲がぶれる。
common_firewalld_zone: public
# firewalld は ufw の limit に相当する rate limit を rule 単位で持たないため、
# rich rule の service 指定で SSH を開け、送信元制限は下の CIDR 変数で行う。
common_firewalld_ssh_source_cidr: "{{ server_monitor_ssh_source_cidr | default('') }}"
# ufw の limit 相当。firewalld の rich rule が受け付ける表記（例 4/m）。
common_firewalld_ssh_rate_limit: "4/m"
# rate limit を効かせるには既定の ssh service accept を外す必要がある。
# 切り戻しが必要な場合だけ false にする。
common_firewalld_manage_ssh_service: true

# SELinux。RHEL 系のみ適用し、既定は enforcing を維持する。
# permissive / disabled へ落とす判断は案件変数として明示的に行う。
# SELinux を実際に操作するか。コンテナ内では kernel 側の状態を変更できない
# ため、Molecule では false にして package と設定内容の検証だけを行う。
common_manage_selinux: true
common_selinux_state: enforcing
common_selinux_policy: targeted
