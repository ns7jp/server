---
- name: Verify common role outcomes
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read configured timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: tz
      changed_when: false

    - name: Assert timezone is set
      ansible.builtin.assert:
        that:
          - tz.stdout == 'Asia/Tokyo'

    # ファイル本文の grep では Include の順序を読み違えたまま通ってしまう。
    # sshd が実際に採用する値を検査する。
    - name: Read the effective sshd configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
      register: sshd_effective
      changed_when: false

    - name: Assert root login and password authentication are effectively disabled
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in (sshd_effective.stdout | lower)"
          - "'passwordauthentication no' in (sshd_effective.stdout | lower)"

    - name: Stat the hardening drop-in
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/10-hardening.conf
      register: sshd_dropin

    - name: Assert the hardening drop-in is installed ahead of cloud-init's
      ansible.builtin.assert:
        that:
          - sshd_dropin.stat.exists

    - name: Check monitor user exists
      ansible.builtin.command: id monitor
      register: id_monitor
      changed_when: false

    - name: Assert monitor user exists
      ansible.builtin.assert:
        that:
          - id_monitor.rc == 0

    - name: Check install directory exists
      ansible.builtin.stat:
        path: /opt/server-monitor
      register: install_dir

    - name: Assert install directory was created
      ansible.builtin.assert:
        that:
          - install_dir.stat.exists
          - install_dir.stat.isdir
          - install_dir.stat.pw_name == 'monitor'
