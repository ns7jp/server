---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
driver:
  name: docker
platforms:
  - name: server-monitor-common
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: yaml
  inventory:
    group_vars:
      all:
        server_monitor_user: monitor
        server_monitor_group: monitor
        server_monitor_install_dir: /opt/server-monitor
        server_monitor_timezone: Asia/Tokyo
        common_password_authentication: false
verifier:
  name: ansible
