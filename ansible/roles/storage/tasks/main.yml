---
# ボリュームを宣言していないホストでは何もしない。lvm2 の導入も行わない。
#
# 以前は `meta: end_role` で打ち切っていたが、これは ansible-core 2.18 以降に
# しかない。Ubuntu 24.04 LTS が同梱するのは 2.16 で、そこでは
# 「invalid meta action requested: end_role」で play ごと失敗する。
# 実機（Ubuntu 24.04 + ansible-core 2.16.3）で踏んだ。
#
# 対象 OS の既定 Ansible で動かないと、配布物として使えない。
# include_tasks + when なら古い版でも動くので、そちらへ寄せた。
- name: Manage the declared LVM storage layout
  ansible.builtin.include_tasks: manage.yml
  when: storage_volumes | length > 0
