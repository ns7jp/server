---
- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ app_repo_target }}"
    state: directory
    owner: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    mode: '0750'

- name: Sync application source from local checkout
  ansible.posix.synchronize:
    src: "{{ app_repo_source }}/"
    dest: "{{ app_repo_target }}/"
    delete: false
    recursive: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=ansible"
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=.artifacts"
      # target host 上でのみ生成するため、controller 側の一時生成物は同期しない。
      - "--exclude=deploy/alertmanager/alertmanager.ansible.yml"
      - "--exclude=deploy/secrets/*.txt"
      - "--exclude=deploy/tls/server.key"
      - "--exclude=deploy/tls/server.crt"
  when: server_monitor_source_mode == 'directory'

- name: Clone repository for git mode
  ansible.builtin.git:
    repo: "{{ server_monitor_git_repo }}"
    dest: "{{ app_repo_target }}"
    version: "{{ server_monitor_git_version }}"
    update: true
    force: false
  become: true
  become_user: "{{ server_monitor_user }}"
  when: server_monitor_source_mode == 'git'

- name: Fix ownership of synced files
  ansible.builtin.file:
    path: "{{ app_repo_target }}"
    state: directory
    owner: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    recurse: true

- name: Ensure secrets directory exists
  ansible.builtin.file:
    path: "{{ server_monitor_secrets_dir }}"
    state: directory
    owner: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    mode: '0700'

- name: Render secret files from vault values
  ansible.builtin.copy:
    dest: "{{ server_monitor_secrets_dir }}/{{ item.name }}"
    content: "{{ item.value }}"
    owner: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    # Compose file-backed secrets retain the host file mode. Grafana (UID 472) and
    # other non-root container users must be able to read the mounted file.
    # The parent secrets directory remains 0700, so unrelated host users cannot traverse it.
    mode: '0644'
  loop: "{{ app_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Render optional Slack webhook secret
  ansible.builtin.copy:
    dest: "{{ server_monitor_secrets_dir }}/slack_webhook_url.txt"
    content: "{{ app_slack_webhook_url }}"
    owner: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    # Alertmanager also reads this file as a non-root container user.
    mode: '0644'
  when: app_use_slack_overlay | bool
  no_log: true

- name: Render .env for compose
  ansible.builtin.copy:
    dest: "{{ app_repo_target }}/.env"
    content: |
      MONITOR_USERNAME={{ monitor_username }}
      MONITOR_NODE_NAME={{ monitor_node_name }}
      MONITOR_PORT={{ monitor_port }}
      PROMETHEUS_PORT={{ prometheus_port }}
      ALERTMANAGER_PORT={{ alertmanager_port }}
      GRAFANA_PORT={{ grafana_port }}
      LOKI_PORT={{ loki_port }}
    owner: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    mode: '0640'

- name: Render environment-specific Alertmanager configuration before compose starts
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ app_repo_target }}/deploy/alertmanager/alertmanager.ansible.yml"
    owner: "{{ server_monitor_user }}"
    group: "{{ server_monitor_group }}"
    # Official Alertmanager runs as a non-root container UID unrelated to the
    # host monitor account. The 0750 install directory protects host traversal.
    mode: '0644'
  notify: Restart managed Alertmanager service

- name: Bring the compose stack up
  community.docker.docker_compose_v2:
    project_src: "{{ app_repo_target }}"
    state: "{{ app_compose_state }}"
    files: >-
      {{ ['compose.yaml']
         + (['compose.slack.yaml.example'] if app_use_slack_overlay else [])
         + ['compose.ansible.yaml']
         + app_compose_additional_files }}
    build: "{{ app_compose_build_policy }}"
    pull: missing
    remove_orphans: true
  register: app_compose_result
