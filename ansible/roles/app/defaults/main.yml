---
app_repo_target: "{{ server_monitor_install_dir }}"
app_repo_source: "{{ server_monitor_source_path }}"
app_monitor_bind_address: 127.0.0.1
app_secrets:
  - name: dashboard_password.txt
    value: "{{ monitor_password }}"
  - name: metrics_token.txt
    value: "{{ metrics_token }}"
  - name: grafana_admin_password.txt
    value: "{{ grafana_admin_password }}"
app_compose_state: present  # present = up -d, absent = down
# docker compose build policy. policy = compose ファイルの build 句に従い、
# 既にイメージが存在する場合は再ビルドしない（冪等）。always はイメージの強制再ビルド。
app_compose_build_policy: policy
app_alertmanager_slack_enabled: false
app_slack_webhook_url: ""
app_use_slack_overlay: "{{ app_alertmanager_slack_enabled | default(false) | bool }}"
# CI のように補助 service を足す環境だけ compose override を指定する。
# 本番・staging の既定値は空で、通常構成を変えない。
app_compose_additional_files: []
# app role が compose 起動前に Alertmanager config を render するための安全な既定値。
app_alertmanager_webhook_enabled: false
app_alertmanager_webhook_url: ""
app_alertmanager_group_wait: 30s
app_alertmanager_group_interval: 5m
app_alertmanager_repeat_interval: 4h

# Prometheus 設定。以前は deploy/prometheus/prometheus.yml を無加工で配布して
# いたため、environment ラベルが 'lab' に固定され、監視対象を増やす方法も
# 「監視スタックをもう 1 式立てる」しか無かった。テンプレート化して、
# server_monitor_environment と監視対象一覧を inventory から与えられるようにする。
app_prometheus_monitor_label: "server-monitor-{{ server_monitor_environment }}"
# 監視サーバー 1 台が N 台を scrape する形。1 台足すときはここへ 1 行足す。
#   app_node_exporter_targets:
#     - address: "10.0.1.21:9100"
#       host: web-01
#     - address: "10.0.1.22:9100"
#       host: db-01
app_node_exporter_targets: []
# blackbox-exporter による外形監視(HTTP probe)の追加対象。node_exporter_targets
# と同じ「1 台の監視サーバーが N 台を見る」形で、nginx の /healthz probe に加えて
# 1 行足すごとに対象が増える(例: docs/build-package-windows の IIS health)。
#   app_blackbox_probe_targets:
#     - url: "https://monitor-win-01.example.test/healthz.html"
#       host: monitor-win-01
#       slo_service: monitor-win-01-iis
app_blackbox_probe_targets: []
# 外部の dead man's switch の URL。設定すると Watchdog をそこへ送る。
# 空のままだと Watchdog は通知先を持たない receiver で止まる。
app_watchdog_webhook_url: ""

# 外部probe / 中央telemetry（docs/roadmap/external-probe-central-telemetry.md）
# 向け。Amazon Managed Service for Prometheus (AMP) への remote_write
# endpoint。terraform/modules/central-metrics の remote_write_url 出力を渡す。
# 空のままだと remote_write は追加されず、既存のホスト内 Prometheus だけの
# 構成を変えない。
app_amp_remote_write_url: ""
app_amp_remote_write_region: "ap-northeast-1"
