---
- name: Verify monitoring role outcomes
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stat managed monitoring directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/server-monitor/deploy
        - /opt/server-monitor/deploy/alertmanager
      register: monitoring_dirs

    - name: Assert monitoring directories have restricted host permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.pw_name == 'monitor'
          - item.stat.mode == '0750'
      loop: "{{ monitoring_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stat app-owned Alertmanager configuration
      ansible.builtin.stat:
        path: /opt/server-monitor/deploy/alertmanager/alertmanager.ansible.yml
      register: app_owned_alertmanager_config

    - name: Assert monitoring role does not synthesize app-owned configuration
      ansible.builtin.assert:
        that:
          - not app_owned_alertmanager_config.stat.exists
