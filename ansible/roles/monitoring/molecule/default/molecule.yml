---
# collections は CI / 構築手順書側で `ansible-galaxy collection install -r
# ansible/requirements.yml` により導入する。molecule の galaxy dependency は
# roles を `role-file`、collections を `requirements-file` という別々のキーで
# 探し、いずれも scenario ディレクトリ基準で解決するため、ここから
# ../../../../requirements.yml を指す指定は実際には読まれていなかった。
driver:
  name: docker
platforms:
  - name: server-monitor-monitoring
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    # molecule の docker driver は既定で
    #   bash -c "while true; do sleep 10000; done"
    # を command に流し込み、イメージの CMD を上書きする。指定しないと
    # systemd が PID 1 にならず、privileged / cgroupns_mode / cgroup mount を
    # 揃えても service モジュールと timedatectl が一切動作しない。
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      # community.general.yaml は community.general 12.0.0 で削除された。
      # 後継は ansible.builtin.default + result_format: yaml（core 2.13 以降）。
      stdout_callback: ansible.builtin.default
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        server_monitor_user: monitor
        server_monitor_group: monitor
        server_monitor_install_dir: /opt/server-monitor
        server_monitor_secrets_dir: /opt/server-monitor/deploy/secrets
        # Molecule では docker run を実行できないため、directory 収束だけを検証する。
        monitoring_run_validation: false
verifier:
  name: ansible
