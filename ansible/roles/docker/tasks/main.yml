---
- name: Validate unprivileged application account before host mutation
  ansible.builtin.assert:
    that:
      - (server_monitor_user | string) != 'root'
      - (server_monitor_group | string) != 'root'
      - (server_monitor_group | string) != 'docker'
    fail_msg: >-
      server_monitor_user and server_monitor_group must not be root, and the
      primary group must not be docker. Docker group membership is root-equivalent.

- name: Refuse an unsupported OS family before any host mutation
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Unsupported OS family {{ ansible_os_family | default('unknown') }}.
      This role supports Debian family and RedHat family only.

- name: Load OS family specific variables
  ansible.builtin.include_vars:
    file: "{{ ansible_os_family }}.yml"

- name: Ensure prerequisites are installed (Debian family)
  ansible.builtin.apt:
    name: "{{ docker_prerequisite_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Ensure prerequisites are installed (RedHat family)
  ansible.builtin.dnf:
    name: "{{ docker_prerequisite_packages }}"
    state: present
    update_cache: true
  when: ansible_os_family == 'RedHat'

- name: Configure the Docker repository and install the engine
  ansible.builtin.include_tasks: "repo-{{ ansible_os_family }}.yml"

# The dedicated service account never invokes Docker. Remove only the
# root-equivalent docker membership left by older role versions, preserving
# unrelated supplementary groups that an operator may have assigned.
- name: Inspect application user supplementary groups
  ansible.builtin.command:
    argv:
      - id
      - -nG
      - "{{ server_monitor_user }}"
  check_mode: false
  changed_when: false
  register: docker_application_user_groups
  when: not ansible_check_mode

- name: Inspect application user primary group
  ansible.builtin.command:
    argv:
      - id
      - -gn
      - "{{ server_monitor_user }}"
  check_mode: false
  changed_when: false
  register: docker_application_user_primary_group
  when: not ansible_check_mode

- name: Remove legacy docker group membership from application user
  ansible.builtin.user:
    name: "{{ server_monitor_user }}"
    groups: >-
      {{ docker_application_user_groups.stdout.split()
         | difference([docker_application_user_primary_group.stdout, 'docker']) }}
    append: false
  when:
    - not ansible_check_mode
    - "'docker' in docker_application_user_groups.stdout.split()"

- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render /etc/docker/daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    owner: root
    group: root
    mode: '0644'
  notify: Restart docker

- name: Ensure docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: docker_manage_service | bool

# daemon.json の変更を compose 起動後まで遅延させると、daemon restart が
# 稼働中 container の published port を失わせる場合がある。workload 配備前に
# handler を確実に完了させ、以後の role は確定済み daemon 上で実行する。
- name: Apply Docker daemon changes before deploying workloads
  ansible.builtin.meta: flush_handlers
