---
docker_apt_release_channel: stable
# 実ホストでは true。Molecule のコンテナ内では docker daemon を起動できないため
# scenario 側で false にし、導入と設定内容の検証だけを行う
# （monitoring ロールの monitoring_run_validation と同じ方針）。
docker_manage_service: true
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_python_packages:
  - docker
docker_log_max_size: "10m"
docker_log_max_file: 5
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: "{{ docker_log_max_size }}"
    max-file: "{{ docker_log_max_file | string }}"
  live-restore: true
