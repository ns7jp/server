---
# collections は CI / 構築手順書側で `ansible-galaxy collection install -r
# ansible/requirements.yml` により導入する。molecule の galaxy dependency は
# roles を `role-file`、collections を `requirements-file` という別々のキーで
# 探し、いずれも scenario ディレクトリ基準で解決するため、ここから
# ../../../../requirements.yml を指す指定は実際には読まれていなかった。
driver:
  name: docker
platforms:
  - name: server-monitor-docker
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      # community.general.yaml は community.general 12.0.0 で削除された。
      # 後継は ansible.builtin.default + result_format: yaml（core 2.13 以降）。
      stdout_callback: ansible.builtin.default
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        server_monitor_user: monitor
        server_monitor_group: monitor
        server_monitor_install_dir: /opt/server-monitor
        # コンテナ内では docker daemon を起動できないため、サービス起動は行わない。
        # verify.yml は binary / compose plugin / daemon.json / group 所属を確認しており、
        # daemon の稼働を前提にしていないため、検証範囲は落ちない。
        docker_manage_service: false
verifier:
  name: ansible
