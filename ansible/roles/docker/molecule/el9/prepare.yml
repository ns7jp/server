---
- name: Prepare legacy Docker membership for migration verification
  hosts: all
  become: true
  tasks:
    - name: Create application primary group
      ansible.builtin.group:
        name: "{{ server_monitor_group }}"
        state: present
        system: true

    - name: Create harmless supplementary group
      ansible.builtin.group:
        name: monitor-observer
        state: present
        system: true

    - name: Create legacy docker group
      ansible.builtin.group:
        name: docker
        state: present
        system: true

    - name: Seed application user with legacy and harmless memberships
      ansible.builtin.user:
        name: "{{ server_monitor_user }}"
        group: "{{ server_monitor_group }}"
        groups:
          - docker
          - monitor-observer
        append: true
        system: true
        shell: /usr/sbin/nologin
        create_home: false
