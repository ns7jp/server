---
- name: Prepare legacy Docker membership for migration verification
  hosts: all
  # geerlingguy/docker-rockylinux9-ansible の PAM スタックには既知の不具合が
  # あり、root で接続した状態から sudo を呼ぶだけで
  # "PAM account management error: Authentication service cannot retrieve
  # authentication info" となって毎回失敗する（役割固有のタスクへ到達する
  # 前、Gathering Facts の時点で落ちる）。docker 接続はこのイメージへ
  # 最初から root で入るため、権限昇格そのものが不要。become を使わず
  # root 接続のまま実行する。
  become: false
  tasks:
    - name: Create application primary group
      ansible.builtin.group:
        name: "{{ server_monitor_group }}"
        state: present
        system: true

    - name: Create harmless supplementary group
      ansible.builtin.group:
        name: monitor-observer
        state: present
        system: true

    - name: Create legacy docker group
      ansible.builtin.group:
        name: docker
        state: present
        system: true

    - name: Seed application user with legacy and harmless memberships
      ansible.builtin.user:
        name: "{{ server_monitor_user }}"
        group: "{{ server_monitor_group }}"
        groups:
          - docker
          - monitor-observer
        append: true
        system: true
        shell: /usr/sbin/nologin
        create_home: false
