---
# docs/build-package-windows/03-parameter-sheet.md の設計値に対応する変数。
# 実機値(IP・CIDR・SHA256等)はこのリポジトリではなく、inventoryのhost_vars/
# group_varsか、秘密値台帳へ記録する。ここでの既定値はすべて安全側(空/最小)。

common_windows_timezone: "Tokyo Standard Time"

# WinRM(5986/tcp)を許可する送信元。空のままだと許可ルールを作らず、
# 既存のwinrm quickconfig生成ルールに任せる(締め付けは行われない)。
common_windows_mgmt_cidr: ""

# IIS(80/443)を許可する内部・管理ネットワークの範囲。空なら制限しない。
common_windows_iis_source_cidr: ""

# windows_exporter(9182)を許可する、中央Prometheus hostの実IP。
# host-accessのMASQUERADEによりWindows側から見える送信元はDockerホスト自身の
# 実IPになる点に注意(docs/build-package-windows/04-network-ip-plan.md参照)。
# 空のままだと許可ルールを作らない(=windows_exporterへの到達経路が無い)。
common_windows_prometheus_source_ip: ""

common_windows_exporter_port: 9182
# GitHub Releasesで確認したバージョンとSHA256を明示的に渡す。空のままでは
# 導入タスクをskipし、ハッシュ未検証でのインストールを行わない。
common_windows_exporter_version: ""
common_windows_exporter_sha256: ""
common_windows_exporter_collectors: "cpu,cs,logical_disk,net,os,service,system,iis"
common_windows_exporter_install_dir: 'C:\Program Files\windows_exporter'

common_windows_iis_features:
  - Web-Server
  - Web-Common-Http
  - Web-Mgmt-Console
common_windows_iis_healthcheck_path: 'C:\inetpub\wwwroot\healthz.html'
common_windows_iis_healthcheck_content: "OK"

# Windows Server Backup。バックアップ格納先ボリュームは環境ごとに決まるため
# 既定値は空(未設定時はバックアップ登録タスクをskipする)。
common_windows_backup_target_volume: ""
common_windows_backup_schedule_time: "03:30"

# Grafana Alloy for Windows(FR-05、ログ集約経路)。中央Lokiのpush APIは
# 現状compose.yamlで127.0.0.1のみにbindされており、Windows実機からの到達性・
# 認証設計がNOT SET(docs/build-package-windows/00-requirements.md参照)。
# その解消を待たず設定・導入手順だけを先行して用意するが、以下が空のままでは
# 導入タスクをskipする(未検証のダウンロードURLを推測で埋めない)。
# ダウンロードURLはGitHub Releases(https://github.com/grafana/alloy/releases)
# の実機決定時点でのWindows向けasset名を確認して明示的に渡すこと
# (windows_exporterと異なり本パックではasset命名規則を確認できていないため、
# バージョン番号からの自動組み立てはしない)。
common_windows_alloy_download_url: ""
common_windows_alloy_sha256: ""
common_windows_alloy_install_dir: 'C:\Program Files\GrafanaAlloy'
common_windows_alloy_data_dir: 'C:\ProgramData\GrafanaAlloy'
# config.windows.alloy.j2の文字列リテラル(River構文、HCL同様に`\`はエスケープ
# 導入文字)にそのまま埋め込むため、Windowsパスでも`\`ではなく`/`区切りで書く。
# Win32 APIはパス区切りとして`/`も受け付けるため、Ansible/PowerShell側の他の
# パス変数(common_windows_alloy_install_dir等)とは扱いを分けている。
common_windows_iis_log_dir: 'C:/inetpub/logs/LogFiles'
# 中央LokiのPush API URL。現時点でNOT SET(上記のネットワーク・認証設計が
# 前提)。例: "https://monitor-01.example.test/loki/api/v1/push"
common_windows_loki_push_url: ""
# Loki側で認証を追加した場合のbearer token file(Windows上のファイルパス)。
# 上記iis_log_dirと同じ理由で`/`区切りで書く。空ならconfig側に
# bearer_token_file行を出力しない。
common_windows_loki_push_bearer_token_file: ""
