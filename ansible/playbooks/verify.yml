---
# 配備後の健全性検証。site.yml の末尾と、独立した smoke test の両方で使う。
- name: Verify monitoring stack endpoints
  hosts: monitor
  become: true
  gather_facts: false
  pre_tasks:
    - name: Skip runtime verification during check mode
      ansible.builtin.meta: end_play
      when: ansible_check_mode
  tasks:
    - name: Wait for Flask app /healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitor_port }}/healthz"
        return_content: true
        status_code: 200
      register: healthz
      retries: 20
      delay: 3
      until: healthz.status == 200

    - name: Assert healthz body
      ansible.builtin.assert:
        that:
          - healthz.json.status == 'ok'

    - name: Assert dashboard requires Basic authentication
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitor_port }}/"
        status_code: 401

    - name: Assert dashboard accepts configured Basic authentication
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitor_port }}/"
        user: "{{ monitor_username }}"
        password: "{{ monitor_password }}"
        force_basic_auth: true
        status_code: 200
      no_log: true

    - name: Wait for Prometheus readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/-/ready"
        status_code: 200
      register: prom_ready
      retries: 20
      delay: 3
      until: prom_ready.status == 200

    - name: Wait for linux-node target to be scraped successfully
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ prometheus_port
          }}/api/v1/query?query=up%7Bjob%3D%22linux-node%22%7D
        return_content: true
        status_code: 200
      register: linux_node_up
      retries: 20
      delay: 3
      until:
        - linux_node_up.json.status == 'success'
        - linux_node_up.json.data.result | length > 0
        - linux_node_up.json.data.result[0].value[1] == '1'

    - name: Wait for Alertmanager readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ alertmanager_port }}/-/ready"
        status_code: 200
      register: alertmanager_ready
      retries: 20
      delay: 3
      until: alertmanager_ready.status == 200

    - name: Wait for Loki readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ loki_port }}/ready"
        status_code: 200
      register: loki_ready
      retries: 30
      delay: 5
      until: loki_ready.status == 200

    - name: Wait for Grafana health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/health"
        status_code: 200
      register: grafana_ready
      retries: 30
      delay: 5
      until: grafana_ready.status == 200

    - name: Assert /metrics is protected by Bearer token
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitor_port }}/metrics"
        status_code: 401
      register: metrics_unauth

    - name: Assert /metrics returns metrics with the configured token
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitor_port }}/metrics"
        headers:
          Authorization: "Bearer {{ metrics_token }}"
        return_content: true
        status_code: 200
      register: metrics_auth
      no_log: true

    - name: Assert metrics body contains server_monitor_cpu_usage_percent
      ansible.builtin.assert:
        that:
          - "'server_monitor_cpu_usage_percent' in metrics_auth.content"
