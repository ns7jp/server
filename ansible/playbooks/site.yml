---
- name: Bootstrap OS for all servers
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common

- name: Configure monitoring stack
  hosts: monitor
  become: true
  gather_facts: true
  # 役割の順序: docker / nginx でホスト前提を整え、app がリポジトリと環境別設定を同期して
  # compose を起動し、その上で monitoring がランタイム構文検証を行う。
  # backup は compose volume の名前が確定した後で systemd timer を導入する。
  roles:
    - role: docker
    - role: nginx
    - role: app
    - role: monitoring
    - role: backup

- name: Verify monitoring stack is healthy
  ansible.builtin.import_playbook: verify.yml

# docs/build-package-windows/ 向け。`windows`グループが未定義または空の
# inventoryでは対象hostが0件のため、既存のLinux host一式には一切影響しない。
# WinRM(HTTPS)が既に到達可能であることが前提(05-build-procedure.md 0〜2節)。
- name: Configure Windows monitored hosts (docs/build-package-windows)
  hosts: windows
  gather_facts: true
  roles:
    - role: common_windows
