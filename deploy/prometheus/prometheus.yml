global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: server-monitor
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["app:5000"]
        labels:
          environment: lab

  - job_name: linux-node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: lab
