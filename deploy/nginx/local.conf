# Nginx >= 1.27.3 supports open-source upstream resolve with a shared zone.
# Keep Docker DNS re-resolution and startup while app is absent, and cache a
# small number of idle upstream connections. Gunicorn must also support
# keepalive (gthread); adding this pool alone would not help with sync workers.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app_backend {
    zone app_backend 64k;
    server app:5000 resolve;
    keepalive 8;
    # Close idle cached sockets before Gunicorn's five-second idle timeout.
    keepalive_timeout 2s;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'" always;

    location = /healthz {
        access_log off;
        proxy_pass http://app_backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
