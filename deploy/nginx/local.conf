# app のホスト名を起動時に一度だけ解決すると、app がまだ起動していない
# タイミングで nginx が「host not found in upstream」で起動に失敗し、
# app が上がるまで無限にクラッシュループする（実機で確認済み）。
# resolver + 変数を使うと、リクエストごとに Docker の埋め込み DNS
# (127.0.0.11) で解決するようになり、app が落ちていても nginx 自体は
# 起動できる（該当リクエストは 502 を返す）。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'" always;

    location = /healthz {
        access_log off;
        set $app_upstream app:5000;
        proxy_pass http://$app_upstream/healthz;
    }

    location / {
        set $app_upstream app:5000;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
