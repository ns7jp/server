name: Ansible integration evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  molecule-test:
    name: Molecule test (${{ matrix.role }} / ${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role:
          - common
          - docker
          - nginx
          - monitoring
        scenario:
          - default
        # RHEL 系 (AlmaLinux / Rocky 9) の経路を持つロールだけ el9 を追加する。
        # 同じ role が別 OS ファミリーで通ることを実コンテナで確認する。
        include:
          - role: common
            scenario: el9
          - role: docker
            scenario: el9
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible and Molecule
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible' 'molecule' 'molecule-plugins[docker]' 'docker'

      # 証跡として、どのバージョンで検証したかを必ずログに残す。
      # community.general 12.0.0 で callback plugin が削除された事例のように、
      # 失敗の原因が依存側のバージョンにあることがあるため。
      - name: Show installed versions
        run: |
          python --version
          ansible --version
          molecule --version
          ansible-galaxy collection list

      # molecule の galaxy dependency は roles を role-file、collections を
      # requirements-file という別々のキーで、かつ scenario ディレクトリ基準で
      # 探すため、リポジトリ共通の ansible/requirements.yml を指せない。
      # 導入をここで明示し、ログにも残す。
      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run full Molecule lifecycle
        working-directory: ansible/roles/${{ matrix.role }}
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test -s ${{ matrix.scenario }}
