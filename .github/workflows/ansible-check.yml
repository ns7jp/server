name: Ansible check

on:
  push:
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-check.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-check.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible toolchain
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible' 'ansible-lint' 'yamllint'

      - name: Show installed versions
        run: |
          ansible --version
          ansible-lint --version

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint --offline

      - name: Validate playbooks parse
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/staging.yml playbooks/site.yml --syntax-check
          ansible-playbook -i inventory/staging.yml playbooks/bootstrap.yml --syntax-check
          ansible-playbook -i inventory/staging.yml playbooks/deploy.yml --syntax-check
          ansible-playbook -i inventory/staging.yml playbooks/verify.yml --syntax-check
          ansible-playbook -i inventory/ci.yml playbooks/site.yml --syntax-check
          ansible-playbook -i inventory/staging.yml playbooks/storage.yml --syntax-check
          ansible-playbook -i inventory/staging.yml playbooks/dhcp.yml --syntax-check
          cp inventory/foundation.local.yml.example inventory/foundation-ci.yml
          ansible-playbook -i inventory/foundation-ci.yml playbooks/foundation.yml --syntax-check
          rm inventory/foundation-ci.yml

      - name: Validate resolved real-host inventory values
        working-directory: ansible
        run: |
          cp inventory/staging.local.yml.example inventory/staging-ci.yml
          ansible-inventory -i inventory/staging-ci.yml --host monitor-01 \
            | python -c 'import json, sys; value=json.load(sys.stdin); assert value["server_monitor_environment"] == "staging"; assert value["server_monitor_source_mode"] == "git"; assert value["server_monitor_git_version"] == "replace-with-40-character-commit-sha"'
          ansible-inventory -i inventory/production.yml --host monitor-prod-01 \
            | python -c 'import json, sys; value=json.load(sys.stdin); assert value["server_monitor_environment"] == "production"; assert value["server_monitor_source_mode"] == "git"; assert value["server_monitor_git_version"] == "replace-with-40-character-commit-sha"'
          rm inventory/staging-ci.yml

  molecule:
    # フル `molecule test` は Docker-in-Docker + systemd で動作させるため共有
    # ランナーで不安定になりやすい。CI では Molecule シナリオ自身の妥当性
    # （scenario の検出、converge / verify の playbook 構文）を確認する。
    # 実コンテナでの create → converge → idempotence → verify は開発者が
    # ローカルで `molecule test` を回す前提とし、deployment-ansible.md に手順を記す。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role:
          - common
          - docker
          - nginx
          - monitoring
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible + Molecule
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible' 'molecule' 'molecule-plugins[docker]' 'docker'

      - name: Show installed versions
        run: |
          ansible --version
          molecule --version

      - name: Molecule scenarios are detected
        working-directory: ansible/roles/${{ matrix.role }}
        run: molecule list

      # default (Ubuntu) と el9 (AlmaLinux / Rocky) の両方を対象にする。
      # el9 scenario を持たないロールは default だけを検証する。
      - name: Validate molecule converge / verify playbooks parse
        working-directory: ansible/roles/${{ matrix.role }}
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
        run: |
          for scenario in molecule/*/; do
            scenario="${scenario%/}"
            echo "::group::${scenario}"
            if [[ -f "${scenario}/prepare.yml" ]]; then
              ansible-playbook "${scenario}/prepare.yml" --syntax-check
            fi
            ansible-playbook "${scenario}/converge.yml" --syntax-check
            ansible-playbook "${scenario}/verify.yml" --syntax-check
            echo "::endgroup::"
          done
