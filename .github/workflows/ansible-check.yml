name: Ansible check

on:
  push:
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-check.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-check.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible toolchain
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible' 'ansible-lint' 'yamllint'

      - name: Show installed versions
        run: |
          ansible --version
          ansible-lint --version

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint --offline

      - name: Validate playbooks parse
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/staging.yml playbooks/site.yml --syntax-check
          ansible-playbook -i inventory/staging.yml playbooks/bootstrap.yml --syntax-check
          ansible-playbook -i inventory/staging.yml playbooks/deploy.yml --syntax-check
          ansible-playbook -i inventory/staging.yml playbooks/verify.yml --syntax-check

  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role:
          - common
          - docker
          - nginx
          - monitoring
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible + Molecule
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible' 'molecule' 'molecule-plugins[docker]' 'docker'

      - name: Show installed versions
        run: |
          ansible --version
          molecule --version

      - name: Pre-pull molecule test image
        run: docker pull geerlingguy/docker-ubuntu2204-ansible:latest

      - name: Molecule test for ${{ matrix.role }}
        working-directory: ansible/roles/${{ matrix.role }}
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
        run: molecule test
