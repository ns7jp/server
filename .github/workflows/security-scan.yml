name: Security scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # v0.36.0 (commit ed142fd) is a direct, linear descendant of the 0.35.0 commit
      # that GHSA-69fq-xp46-6x23 identified as the immutable safe release, released
      # after the 2026-03 tag-hijack incident was remediated. Pinned by commit SHA
      # (not a movable tag) so a future tag repoint cannot silently swap this out.
      - name: Scan dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit runtime requirements
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          pip-audit --requirement requirements.txt
