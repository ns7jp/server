version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  # boto3とbotocoreはversion番号を同期してreleaseされる
  # （例: boto3 1.43.83 <-> botocore 1.43.83）。ansible/controller-requirements.txt
  # で両者を別々のPRとしてbumpすると、片方だけmergeした瞬間に
  # `pip install`がbotocoreの依存解決で失敗しうる（PR #118〜121で実際に
  # boto3単独・botocore単独のPRが別々に生成されるのを確認した）。
  # 1つのPRにまとめる。整合性は tests/test_portfolio_artifacts.py で検査する。
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      boto3-botocore:
        patterns:
          - "boto3"
          - "botocore"

  # Dockerfile は root と labs/three-tier/ap に分散している。terraform の
  # provider 制約と同じ理由で、`directory: /` だけを監視していると labs 側の
  # ベースイメージ更新が届かず、両者の python バージョンが分岐する
  # （PR #17 で実際に起きた）。`directories` で両方を登録し、1 つの PR に
  # まとめる。監視対象と実際の Dockerfile の場所が一致することは
  # tests/test_portfolio_artifacts.py で検査する。
  - package-ecosystem: docker
    directories:
      - /
      - /labs/three-tier/ap
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      docker-base-images:
        patterns:
          - "*"

  # Terraform の provider 制約は root / environments / modules の複数ファイルに
  # 分散して宣言されている。以前は environments/{dev,prod} だけを監視していた
  # ため、Dependabot が env 側だけを更新し、modules 側が古い制約のまま残った。
  # その結果 `~> 5.50, ~> 6.58` のように両立しない制約となり、terraform init が
  # 必ず失敗していた（PR #44 / #45）。
  #
  # 対策として、
  #   1. version 制約を宣言している全ディレクトリを `directories` で登録し、
  #   2. `groups` で 1 つの PR にまとめる
  # ことで、provider 更新が常に整合した状態で届くようにする。
  #
  # 2026-08-25: environments/staging の登録が漏れていた（`versions.tf` は
  # 9 ファイルあるのに、ここには 8 件しか書いていなかった）。次に provider が
  # メジャー更新されると staging だけ古い制約で残り、同じ init 失敗が再発する。
  # 原因は登録忘れそのものより「網羅すべき集合の件数をコメントへ手で固定した」
  # こと。件数を書くのをやめ、`versions.tf` の実在集合と `directories` が
  # 一致することを tests/test_aws_readiness.py で検査する。
  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform/environments/dev
      - /terraform/environments/staging
      - /terraform/environments/prod
      - /terraform/modules/alb
      - /terraform/modules/backup
      - /terraform/modules/central-metrics
      - /terraform/modules/compute
      - /terraform/modules/monitoring
      - /terraform/modules/network
      - /terraform/modules/synthetics-probe
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      terraform-providers:
        patterns:
          - "*"
