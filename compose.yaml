name: server-monitor-lab

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      MONITOR_USERNAME: ${MONITOR_USERNAME:-monitor}
      MONITOR_PASSWORD_FILE: /run/secrets/dashboard_password
      MONITOR_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      MONITOR_NODE_NAME: ${MONITOR_NODE_NAME:-linux-lab-01}
      MONITOR_SHOW_HOSTNAME: "false"
      MONITOR_SHOW_USERNAMES: "false"
    secrets:
      - dashboard_password
      - metrics_token
    expose:
      - "5000"
    networks:
      - frontend
      - monitoring
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Local/CI default is loopback. AWS inventory explicitly sets 0.0.0.0;
      # the EC2 SG is the authoritative ALB-only boundary. UFW records the host
      # policy, but Docker-published traffic is not assumed to traverse INPUT.
      - "${MONITOR_BIND_ADDRESS:-127.0.0.1}:${MONITOR_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - host-access
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - app
      - node-exporter
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./deploy/prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    networks:
      - monitoring
      - host-access
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring
      - host-access
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    networks:
      - monitoring
      - host-access
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
      - host-access
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  docker-socket-proxy:
    # Alloy needs container discovery and log streaming, but must not receive the
    # host Docker socket directly. The proxy exposes only GET/HEAD requests for
    # the containers and networks APIs on a private network shared with Alloy.
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "0"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.16.1
    restart: unless-stopped
    depends_on:
      - loki
      - docker-socket-proxy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      MONITOR_NODE_NAME: ${MONITOR_NODE_NAME:-linux-lab-01}
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - monitoring
      - docker-api
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./deploy/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose:
      - "9115"
    # SLI 用に nginx (frontend) と Prometheus (monitoring) の両方を見るため、両ネットワークに参加する。
    networks:
      - frontend
      - monitoring
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose:
      - "9100"
    networks:
      - monitoring
    read_only: true
    security_opt:
      - no-new-privileges:true

secrets:
  dashboard_password:
    file: ./deploy/secrets/dashboard_password.txt
  metrics_token:
    file: ./deploy/secrets/metrics_token.txt
  grafana_admin_password:
    file: ./deploy/secrets/grafana_admin_password.txt

networks:
  # Linux Dockerではinternal networkだけに接続したserviceのpublished portが
  # hostへ転送されない。公開対象だけをこのbridgeにも接続し、各ports定義側で
  # 127.0.0.1へ明示bindする。app/exporter/collectorはinternal networkだけに残す。
  host-access:
    driver: bridge
  # Docker API proxy is reachable only from Alloy. No host port is published and
  # no other monitoring service joins this network.
  docker-api:
    internal: true
  frontend:
    internal: true
  monitoring:
    internal: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
