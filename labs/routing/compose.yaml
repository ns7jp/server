name: server-monitor-routing-lab

# トポロジは Docker の network ではなく、コンテナの中で network namespace と
# veth と bridge を自分で組む（labs/routing/topology.sh）。
#
# Docker の network を使わない理由は topology.sh の冒頭に書いた。要点は、
# Docker が endpoint ごとに入れる raw PREROUTING のアンチスプーフ規則により
# router を経由した L3 疎通が成立しないこと、コンテナ内の /proc/sys が
# read-only で ip_forward を切り替えられないこと。
#
# 必要な権限をこの 1 コンテナへ閉じ込めているので、後始末は down で済み、
# host 側のネットワークには何も残らない。
services:
  netlab:
    image: nicolaka/netshoot:v0.13
    command: ["sleep", "infinity"]
    # netns / veth / bridge の作成と、netns ごとの sysctl 書き換えに必要。
    # NET_ADMIN だけでは /proc/sys が read-only のままで ip_forward を
    # 切り替えられないため、この演習では privileged が要る。
    privileged: true
    volumes:
      - ./topology.sh:/opt/topology.sh:ro
