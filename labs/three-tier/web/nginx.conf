# Web 層。静的応答と、AP 層へのリバースプロキシだけを担当する。
# DB へは接続しない（そもそも db-tier ネットワークに参加していない）。
upstream ap_tier {
    server ap:8000;
}

server {
    listen 80;
    server_name _;

    # Web 層自身の生存確認。AP / DB を見ない。
    # 3 層のどこまで生きているかを 1 段ずつ確認できるようにするため、
    # 層ごとに独立した health endpoint を持たせている。
    location = /web-healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "web ok\n";
    }

    location / {
        proxy_pass http://ap_tier;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        # AP が落ちているときに 502 をすぐ返す。既定のままだと
        # 利用者から見た症状が「遅い」になり、切り分けが遅れる。
        proxy_next_upstream off;
    }
}
