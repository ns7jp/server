# Web 層。静的応答と、AP 層へのリバースプロキシだけを担当する。
# DB へは接続しない（そもそも db-tier ネットワークに参加していない）。

# upstream ブロックで ap を書くと、nginx が起動時に一度だけ名前解決する。
# これには 2 つの罠がある。
#
#   1. nginx が ap より先に起動すると "host not found in upstream" で
#      nginx 自体が起動に失敗する
#   2. 障害演習で ap を stop / start すると ap の IP が変わりうる。
#      nginx は古い IP を掴んだままになり、ap が復帰しても 502 が続く
#      （= 復旧したのに直らない、という誤った観測になる）
#
# labs/network-troubleshooting で同じ罠を踏んでいるので、こちらも
# resolver + 変数によるリクエストごとの動的解決にする。
# 127.0.0.11 は Docker の組み込み DNS。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Web 層自身の生存確認。AP / DB を見ない。
    # 3 層のどこまで生きているかを 1 段ずつ確認できるようにするため、
    # 層ごとに独立した health endpoint を持たせている。
    location = /web-healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "web ok\n";
    }

    location / {
        # 変数に入れることで、リクエストごとに resolver へ問い合わせる。
        set $ap_upstream ap:8000;
        proxy_pass http://$ap_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        # AP が落ちているときに 502 をすぐ返す。既定のままだと
        # 利用者から見た症状が「遅い」になり、切り分けが遅れる。
        proxy_next_upstream off;
    }
}
