name: server-monitor-network-lab

services:
  client:
    image: curlimages/curl:8.10.1
    command: ["sleep", "infinity"]
    networks:
      frontend:
        ipv4_address: 172.28.10.20

  proxy:
    image: nginx:1.27.2-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      frontend:
        ipv4_address: 172.28.10.10
      backend:
        ipv4_address: 172.28.20.10

  app:
    image: hashicorp/http-echo:1.0.0
    command: ["-listen=:5678", "-text=server-monitor network lab: ok"]
    networks:
      backend:
        ipv4_address: 172.28.20.20

networks:
  frontend:
    name: server-monitor-lab-frontend
    ipam:
      config:
        - subnet: 172.28.10.0/24
  backend:
    name: server-monitor-lab-backend
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24

