# 今日 deploy/nginx/local.conf で見つかった不具合と同じ罠を避ける。
# app を起動時に一度だけ名前解決すると、proxy が app より先に起動した
# 場合(depends_on が無いため順序は保証されない) host not found in
# upstream で proxy 自体が起動に失敗しうる。resolver + 変数で
# リクエストごとの動的解決にする。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    location / {
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        set $app_upstream app:5678;
        proxy_pass http://$app_upstream;
    }
}

