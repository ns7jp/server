# Ansible deployment override. Direct `docker compose up` keeps using the
# checked-in local-lab configuration from compose.yaml.
services:
  alertmanager:
    volumes:
      - ./deploy/alertmanager/alertmanager.ansible.yml:/etc/alertmanager/alertmanager.yml:ro
  prometheus:
    volumes:
      - ./deploy/prometheus/prometheus.ansible.yml:/etc/prometheus/prometheus.yml:ro
